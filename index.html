<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Under Maintenance</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, sans-serif;
        }

        body{
            background:#0f172a;
            color:white;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            text-align:center;
        }

        .container{
            max-width:700px;
            padding:40px;
        }

        .badge{
            display:inline-block;
            padding:10px 20px;
            background:#f59e0b;
            color:#000;
            font-weight:bold;
            border-radius:999px;
            margin-bottom:25px;
        }

        h1{
            font-size:3rem;
            margin-bottom:20px;
        }

        p{
            font-size:1.1rem;
            color:#cbd5e1;
            line-height:1.7;
            margin-bottom:10px;
        }

        footer{
            margin-top:30px;
            color:#94a3b8;
            font-size:0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="badge">🚧 UNDER MAINTENANCE 🚧</div>

        <h1>We're Working on Something Great</h1>

        <p>
            Our website is currently undergoing maintenance and improvements.
        </p>

        <p>
            We're working hard to bring you a better experience.
            Please check back soon.
        </p>

        <footer>
            Thank you for your patience.
        </footer>
    </div>
</body>
</html>
